name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python test_host.py

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify SDK revision
        shell: pwsh
        run: |
          $expected = (git rev-parse HEAD:sdk).Trim()
          $actual = (git -C sdk rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $expected -ne $actual) { throw "SDK submodule revision mismatch" }
      - name: Install pinned MIPS toolchain
        shell: pwsh
        run: pwsh ./sdk/scripts/setup_toolchain.ps1
      - name: Build and validate BDA
        shell: pwsh
        run: |
          python build.py
          if ($LASTEXITCODE -ne 0) { throw "BDA build failed" }
      - name: Generate BDA checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath RoadRash.bda -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath SHA256SUMS.txt -Value "$hash  RoadRash.bda" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: road-rash-bda
          path: |
            RoadRash.bda
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, build]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Download exact build artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name road-rash-bda --dir release-assets
          if ($LASTEXITCODE -ne 0) { throw "Artifact download failed" }
      - name: Verify and publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $line = (Get-Content -LiteralPath release-assets/SHA256SUMS.txt -Raw).Trim()
          if ($line -notmatch '^([0-9a-f]{64})  RoadRash\.bda$') { throw "Invalid checksum manifest" }
          $actual = (Get-FileHash -LiteralPath release-assets/RoadRash.bda -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $Matches[1]) { throw "BDA checksum mismatch" }
          gh release create $env:GITHUB_REF_NAME release-assets/RoadRash.bda release-assets/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --verify-tag --target $env:GITHUB_SHA --title "暴力摩托 9588 $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
